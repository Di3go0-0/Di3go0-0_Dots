[mgr]
ratio          = [1, 3, 4]
sort_by        = "mtime"
sort_sensitive = false
sort_reverse   = true
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1000
max_height      = 1200
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 80
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '$EDITOR "$@"', desc = "Edit (nvim)", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open with xdg", orphan = true, for = "linux" },
]
reveal = [
  { run = 'nautilus "$1"', desc = "Reveal in Nautilus", orphan = true, for = "linux" },
]
extract = [
  { run = 'ouch d -y "$@"', desc = "Extract here (ouch)", for = "unix" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, desc = "Play with mpv", for = "unix" },
]

[open]
rules = [
  { mime = "inode/directory",             use = [ "edit", "open", "reveal" ] },
  { mime = "text/*",                      use = [ "edit", "reveal" ] },
  { mime = "image/*",                     use = [ "open", "reveal" ] },
  { mime = "video/*",                     use = [ "play", "open", "reveal" ] },
  { mime = "audio/*",                     use = [ "play", "open", "reveal" ] },
  { mime = "application/json",            use = [ "edit", "reveal" ] },
  { mime = "application/x-bittorrent",    use = [ "play" ] },
  { mime = "application/zip",             use = [ "extract", "reveal" ] },
  { mime = "application/gzip",            use = [ "extract", "reveal" ] },
  { mime = "application/x-tar",           use = [ "extract", "reveal" ] },
  { mime = "application/x-7z-compressed", use = [ "extract", "reveal" ] },
  { mime = "application/x-rar",           use = [ "extract", "reveal" ] },
  { mime = "application/xz",              use = [ "extract", "reveal" ] },
  { mime = "application/x-zstd",          use = [ "extract", "reveal" ] },
  { mime = "*",                           use = [ "open", "reveal" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912 # 512MB
image_bound      = [0, 0]
suppress_preload = false

[input]
cursor_blink = true

[which]
sort_by      = "key"
sort_sensitive = false
sort_reverse   = false
