# Glass theme — alineado con el resto del setup (mauve accent)
# Colores derivados del rofi/hyprlock glass theme

[mgr]
cwd = { fg = "#cba6f7" }

# Hovered
hovered         = { fg = "#1e1e2e", bg = "#cba6f7" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#f9e2af", italic = true }
find_position = { fg = "#f38ba8", bg = "reset", italic = true }

# Marker
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

# Tab
tab_active   = { fg = "#1e1e2e", bg = "#cba6f7" }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
tab_width    = 1

# Count
count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#89b4fa" }

# Border
border_symbol = "│"
border_style  = { fg = "#6c7086" }

# Highlighting
syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }

mode_normal = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
mode_select = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
mode_unset  = { fg = "#1e1e2e", bg = "#fab387", bold = true }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#cba6f7", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

permissions_t = { fg = "#89b4fa" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#6c7086" }

[select]
border   = { fg = "#cba6f7" }
active   = { fg = "#f5c2e7" }
inactive = {}

[input]
border   = { fg = "#cba6f7" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#cba6f7" }
active   = { bg = "#45475a" }
inactive = {}

[tasks]
border  = { fg = "#cba6f7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#1e1e2e" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#94e2d5" }
run     = { fg = "#f5c2e7" }
desc    = {}
hovered = { bg = "#45475a", bold = true }
footer  = { fg = "#1e1e2e", bg = "#cdd6f4" }

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#a6e3a1" },
  # Videos
  { mime = "video/*", fg = "#f9e2af" },
  { mime = "audio/*", fg = "#f9e2af" },
  # Archives
  { mime = "application/zip",             fg = "#fab387" },
  { mime = "application/gzip",            fg = "#fab387" },
  { mime = "application/x-tar",           fg = "#fab387" },
  { mime = "application/x-bzip",          fg = "#fab387" },
  { mime = "application/x-bzip2",         fg = "#fab387" },
  { mime = "application/x-7z-compressed", fg = "#fab387" },
  { mime = "application/x-rar",           fg = "#fab387" },
  { mime = "application/xz",              fg = "#fab387" },
  # Docs
  { mime = "application/pdf",             fg = "#f38ba8" },
  # Directorios (fallback con MIME real)
  { mime = "inode/directory",             fg = "#89b4fa" },
]
