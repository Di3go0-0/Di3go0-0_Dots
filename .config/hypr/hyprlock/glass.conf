# ────────────────────────────────────────────────────────────
#  Glass theme para hyprlock
#  Layout: greeting · time · date · input · bottom widgets
#  Colors: matching glass theme (mauve accent #cba6f7)
# ────────────────────────────────────────────────────────────

$font       = SF Pro Display
$fontMono   = CaskaydiaCove Nerd Font Mono
$accent     = rgba(203, 166, 247, 1.0)
$fg         = rgba(205, 214, 244, 1.0)
$fgDim      = rgba(166, 173, 200, 0.85)
$fgMute     = rgba(166, 173, 200, 0.55)
$panel      = rgba(15, 17, 26, 0.55)
$panelBd    = rgba(203, 166, 247, 0.25)
$inputBg    = rgba(30, 33, 50, 0.55)
$inputBd    = rgba(203, 166, 247, 0.45)

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# ── BACKGROUND (wallpaper random + blur) ───────────────────
background {
    monitor =
    path = $BACKGROUND
    blur_passes = 3
    blur_size = 8
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.16
    vibrancy_darkness = 0.0
}

# ── GREETING (top: "Good morning, USER") ───────────────────
label {
    monitor =
    text = cmd[update:60000] bash -c 'h=$(date +%H); if [ $h -lt 12 ]; then g="Good morning"; elif [ $h -lt 19 ]; then g="Good afternoon"; else g="Good evening"; fi; echo "$g, $USER"'
    color = $fgDim
    font_size = 18
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# ── TIME (giant clock) ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 96
    font_family = $font Bold
    position = 0, 80
    halign = center
    valign = center
}

# ── DATE (below time) ──────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $fgDim
    font_size = 16
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# ── INPUT FIELD ────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $inputBd
    inner_color = $inputBg
    font_color = $fg
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##a6adc88c">     Enter password</span>
    hide_input = false
    rounding = 12
    check_color = $accent
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300
    capslock_color = rgb(249, 226, 175)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -80
    halign = center
    valign = center
}

# ── BOTTOM ROW: USER + WIDGETS ─────────────────────────────

# Label "USER" arriba del input
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = $fgMute
    font_size = 14
    font_family = $fontMono
    position = 0, -40
    halign = center
    valign = center
}

# Battery (bottom-left)
label {
    monitor =
    text = cmd[update:30000] bash -c 'c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$c" ] && echo "  $c%" || echo ""'
    color = $fgDim
    font_size = 14
    font_family = $fontMono
    position = 30, 30
    halign = left
    valign = bottom
}

# Network (bottom-left, después de battery)
label {
    monitor =
    text = cmd[update:5000] bash -c 's=$(nmcli -t -f STATE g 2>/dev/null); [ "$s" = "connected" ] && echo "  $(nmcli -t -f NAME c show --active 2>/dev/null | head -1)" || echo "  Offline"'
    color = $fgDim
    font_size = 14
    font_family = $fontMono
    position = 130, 30
    halign = left
    valign = bottom
}

# Volume (bottom-right, separado del keyboard)
label {
    monitor =
    text = cmd[update:1000] bash -c 'v=$(pamixer --get-volume 2>/dev/null); m=$(pamixer --get-mute 2>/dev/null); [ "$m" = "true" ] && echo "  muted" || echo "  $v%"'
    color = $fgDim
    font_size = 14
    font_family = $fontMono
    position = -220, 30
    halign = right
    valign = bottom
}

# Keyboard layout (bottom-right, esquina)
label {
    monitor =
    text = cmd[update:5000] bash -c 'k=$(hyprctl devices -j 2>/dev/null | jq -r ".keyboards[] | select(.main==true) | .active_keymap" | head -1); echo "  $k"'
    color = $fgDim
    font_size = 14
    font_family = $fontMono
    position = -30, 30
    halign = right
    valign = bottom
}
